[project]
name = "llm-inference-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers==5.23.0",
    "jinja2>=3.1,<4",
    "torch==2.14.1+cu130; sys_platform == 'win32'",
    "torch>=2.4; sys_platform != 'win32'",
    "nano-vllm",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
nano-vllm = { path = "../nano-vllm", editable = true }

[tool.uv]
# nano-vLLM imports Windows fallback implementations in this lab. Its upstream
# metadata still lists the Linux-only Triton and FlashAttention packages as
# unconditional dependencies, so keep them out of the Windows environment.
override-dependencies = [
    "flash-attn; sys_platform != 'win32'",
    "triton>=3.0.0; sys_platform != 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
